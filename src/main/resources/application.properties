server.port=${SERVER_PORT:8082}

spring.application.name=ticket-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tickets_db}
spring.datasource.username=${DATABASE_USER:solutis}
spring.datasource.password=${DATABASE_PASSWORD:solutis}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

services.user.url=${USER_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
